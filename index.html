:is(#main.enter,#main.upd) .vb i{animation:gy .8s var(--ease) both;transform-origin:bottom}

:is(#main.enter,#main.upd) path.ln{stroke-dasharray:1;animation:dr 1.3s var(--ease) both}

circle[stroke-dasharray]{transition:stroke-width .25s var(--ease)}circle[stroke-dasharray]:hover{stroke-width:8}

 .hd{gap:12px}.hd .act{width:100%}.srch{width:100%}.hd .act .btn{flex:1 1 auto;justify-content:center}.hd .act .av{display:none}

<script>
const DB={"R":[{"id":1,"texto":"Deixei meu carro na oficina depois de uma batida. Na segunda, recebi uma mensagem dizendo que o conserto estava autorizado. Hoje fui buscar o carro e o mecânico falou que ainda falta liberar o farol. Na central, disseram que a autorização já foi enviada. Aquela mensagem incluía o farol ou a oficina me deu o prazo sem saber se podia trocar a peça? Preciso do carro pra trabalhar.","data":"2026-07-01","canal":"Proconsumidor","uf":"RJ","origem":"Corretora Lume Azul","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Auto","natureza":"Sinistro","motivo":"Demora na análise do sinistro"},"conf":88,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: carro, oficina, batida, farol. Produto sugerido: Auto; natureza sugerida: Sinistro."},{"id":2,"texto":"Consultei o site da Susep e encontrei uma apólice em meu nome com a descrição ‘Vida e Previdência’. O mês de início bate com a época em que renegociei um empréstimo, mas a única coisa que lembro de ter aceitado foi a parcela nova. Quero receber o documento que mostra o que eu contratei. Se estão cobrando por um seguro que eu não pedi, quero cancelar e receber em dobro o que paguei.","data":"2026-07-01","canal":"Canais Internos","uf":"MG","origem":"Banco Vale Sereno — Agência Ipê","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"Vida","natureza":"Comercialização","motivo":"Contratação não reconhecida"},"conf":64,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: vida, lembro, não pedi. Produto sugerido: Vida; natureza sugerida: Comercialização. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":3,"texto":"O corretor falou que, se eu ficasse sem carro depois de uma batida, teria direito a sete dias de carro reserva. Bati na sexta e a locadora só tinha carro pra segunda. Agora querem que eu devolva na quinta, contando desde o acidente. No aplicativo aparece ‘sete diárias’, sem nenhuma data. Quero saber se lançaram diárias de um carro que nem estava comigo.","data":"2026-07-02","canal":"Bacen","uf":"SP","origem":"Corretora Farol Sereno","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Auto","natureza":"Sinistro","motivo":"Demora na análise do sinistro"},"conf":85,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: carro, batida, locadora, acidente. Produto sugerido: Auto; natureza sugerida: Sinistro. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":4,"texto":"Quando abri a conta, pedi pra separar cem reais por mês pra minha neta. A moça disse que eu ainda concorreria a prêmios. Agora preciso do dinheiro e, de tudo que saiu da conta, estão oferecendo pouco mais da metade. Na agência chamaram de título, mas no meu extrato aparece ‘seguradora’. Podem me dizer o que eu tenho e por que o valor disponível é tão diferente do que depositei?","data":"2026-07-03","canal":"Consumidor.gov","uf":"BA","origem":"Banco Cedro Novo — Agência Estação","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"Capitalização","natureza":"Pagamento","motivo":"Cobrança ou débito divergente"},"conf":75,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: título, extrato. Produto sugerido: Capitalização; natureza sugerida: Pagamento. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":5,"texto":"Depois da chuva, começou a pingar água pela luminária da sala. Chamei a assistência do seguro da casa e mandaram um eletricista. Ele desligou a luz e foi embora dizendo que o telhado era com outra equipe. Recebi uma mensagem de ‘atendimento concluído’, mas continua pingando. Fecharam só a visita do eletricista ou também o pedido que fiz pelos estragos no teto?","data":"2026-07-05","canal":"Proconsumidor","uf":"PR","origem":"Corretora Pontal Dourado","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"RE","natureza":"Sinistro","motivo":"Serviço de assistência"},"conf":75,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: casa, assistência. Produto sugerido: RE; natureza sugerida: Sinistro. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":6,"texto":"Minha mãe faleceu e a empresa onde ela trabalhava me passou o telefone do seguro de vida. Enviei os documentos pelo link que recebi. Agora o atendimento diz que o CPF dela não foi localizado, mas no último contracheque tem um desconto de ‘seguro grupo’. Não sei se consultaram o contrato certo. Quero que confiram pelo nome da empresa antes de me mandar abrir tudo de novo.","data":"2026-07-07","canal":"Canais Internos","uf":"PE","origem":"Empresa Vértice Têxtil — RH","tipo_origem":"Empresa parceira","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Vida","natureza":"Comercialização","motivo":"Informação divergente na venda"},"conf":78,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: seguro de vida, vida, faleceu, desconto. Produto sugerido: Vida; natureza sugerida: Comercialização. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":7,"texto":"Paguei o boleto do seguro do carro pelo código que copiei no aplicativo. Dois dias depois, o mesmo valor saiu no débito automático. O corretor falou que um pagamento deve ser da renovação, só que a apólice antiga ainda tem um mês pela frente. Preciso saber a qual parcela pertence cada pagamento e se vão devolver o que saiu a mais.","data":"2026-07-07","canal":"Bacen","uf":"GO","origem":"Corretora Vereda Clara","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Auto","natureza":"Pagamento","motivo":"Cobrança ou débito divergente"},"conf":88,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: carro, boleto, débito, pagamento. Produto sugerido: Auto; natureza sugerida: Pagamento."},{"id":8,"texto":"Pedi pra parar de contribuir com a previdência por uns meses. A atendente disse que estava feito. Ontem entrei no aplicativo e apareceu ‘plano encerrado’, com saldo zero. Não recebi dinheiro na conta nem pedi resgate. Quero saber onde está o valor que juntei e se encerraram o plano inteiro quando eu só pedi uma pausa nos depósitos.","data":"2026-07-08","canal":"Consumidor.gov","uf":"RJ","origem":"Banco Riacho Azul — Agência Central","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"Previdência","natureza":"Pagamento","motivo":"Resgate ou reembolso pendente"},"conf":71,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: previdência, depósito, saldo, resgate. Produto sugerido: Previdência; natureza sugerida: Pagamento. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":9,"texto":"Meu carro apagou na estrada e pedi guincho pelo aplicativo. O motorista me ligou dizendo que estava no endereço, mas descreveu um posto que fica do outro lado da cidade. Depois recebi uma avaliação da corrida e consta que já usei um atendimento. Fui eu que marquei o ponto errado ou mandaram o endereço do meu cadastro? Paguei um reboque por fora e quero que analisem esse gasto.","data":"2026-07-09","canal":"Proconsumidor","uf":"CE","origem":"Corretora Horizonte do Vale","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Auto","natureza":"Apólice","motivo":"Documento ou dados desatualizados"},"conf":87,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: carro, guincho, motorista, cadastro. Produto sugerido: Auto; natureza sugerida: Apólice."},{"id":10,"texto":"Sempre recebo um valor da previdência no fim do mês. Desta vez veio quase trezentos reais a menos. No telefone falaram em imposto, mas a agência disse que pode ser um acerto do mês anterior. O extrato só mostra o valor que caiu. Quero um demonstrativo que explique a diferença e saber quanto devo contar que entra no mês que vem.","data":"2026-07-09","canal":"Proconsumidor","uf":"RS","origem":"Banco Horizonte Claro — Agência Lagoa","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Previdência","natureza":"Pagamento","motivo":"Cobrança ou débito divergente"},"conf":88,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: previdência, extrato. Produto sugerido: Previdência; natureza sugerida: Pagamento."},{"id":11,"texto":"Assaltaram minha loja e levaram mercadoria e um notebook que uso no caixa. Abri um aviso só, porque foi tudo no mesmo assalto. Recebi um depósito e uma mensagem dizendo que o processo foi encerrado. Não veio a relação do que foi pago. Quero saber se o notebook ficou de fora ou se descontaram alguma coisa do valor das mercadorias.","data":"2026-07-12","canal":"Canais Internos","uf":"MA","origem":"Banco Vale Sereno — Agência Ipê","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"RE","natureza":"Pagamento","motivo":"Cobrança ou débito divergente"},"conf":58,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: depósito. Produto sugerido: RE; natureza sugerida: Pagamento. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":12,"texto":"No financiamento do carro, me disseram que eu precisava assinar todas as telas pro dinheiro ser liberado. Depois chegou um e-mail de boas-vindas de um seguro de vida. O vendedor diz que eu podia ter desmarcado, mas eu nem segurei o tablet, só assinei no quadrinho que ele mostrou. Quero saber quanto isso acrescentou às parcelas e receber uma cópia da tela em que consta que eu escolhi o seguro.","data":"2026-07-12","canal":"Bacen","uf":"SP","origem":"Concessionária Estrada Nova","tipo_origem":"Empresa parceira","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Vida","natureza":"Pagamento","motivo":"Cobrança ou débito divergente"},"conf":68,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: seguro de vida, vida, parcela. Produto sugerido: Vida; natureza sugerida: Pagamento. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":13,"texto":"Troquei de carro e mandei os dados pro corretor na quarta. Ele respondeu ‘pode rodar tranquilo’. No sábado quebraram o vidro do carro novo e, quando liguei, só encontraram a placa do antigo. Hoje apareceu o carro novo no aplicativo, mas não consigo ver desde quando vale a alteração. Quero saber se vão atender o vidro e o que o corretor quis dizer com aquela confirmação.","data":"2026-07-13","canal":"Consumidor.gov","uf":"ES","origem":"Corretora Farol Sereno","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Auto","natureza":"Sinistro","motivo":"Demora na análise do sinistro"},"conf":79,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: carro, placa, vidro, quebraram. Produto sugerido: Auto; natureza sugerida: Sinistro. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":14,"texto":"Meu título foi sorteado, pelo menos foi isso que entendi da mensagem ‘seu número está entre os contemplados’. Quando liguei, pediram o número da série e disseram que o meu não ganhou. Na mensagem só aparecem cinco algarismos, iguais aos do meu título. Quero que confiram o sorteio e expliquem por que recebi esse aviso no meu celular.","data":"2026-07-15","canal":"Proconsumidor","uf":"AM","origem":"Banco Cedro Novo — Agência Estação","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Capitalização","natureza":"Aplicativo","motivo":"Falha em canal digital"},"conf":86,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: título, sorteio, mensagem. Produto sugerido: Capitalização; natureza sugerida: Aplicativo."},{"id":15,"texto":"Acionei o seguro por causa de um vazamento no apartamento. O encanador que veio abriu a parede, trocou uma conexão e disse que alguém voltaria pra fechar. Já o condomínio diz que aquele cano é da prumada e que eu nem devia ter mexido. Agora estou com um buraco no banheiro e ninguém marcou o retorno. Quero saber quem ficou de fazer o acabamento e se a visita foi registrada como reparo definitivo.","data":"2026-07-15","canal":"Canais Internos","uf":"SC","origem":"Corretora Pontal Dourado","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"RE","natureza":"Sinistro","motivo":"Demora na análise do sinistro"},"conf":91,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: apartamento, vazamento, banheiro, reparo. Produto sugerido: RE; natureza sugerida: Sinistro."},{"id":16,"texto":"Meu marido tinha um cartão na carteira com a palavra ‘funeral’ e o nome da seguradora. Quando ele faleceu, liguei pro número do cartão, esperei o retorno e acabei pagando a funerária. Agora falaram que o serviço precisava ter sido organizado por eles pra ter cobertura. Eu liguei antes do enterro. Quero que ouçam a gravação, porque saí daquela ligação entendendo que podia resolver e mandar a nota depois.","data":"2026-07-17","canal":"Bacen","uf":"PB","origem":"Corretora Lume Azul","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Vida","natureza":"Apólice","motivo":"Documento ou dados desatualizados"},"conf":88,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: faleceu, cobertura. Produto sugerido: Vida; natureza sugerida: Apólice."},{"id":17,"texto":"Uma pessoa re duas compras no cartão. Eu vinha pagando uma proteção todo mês justamente por causa do celular. Quero saber se abriram também um pedido pelo aparelho ou se aquela ligação ficou registrada só como contestação das compras.","data":"2026-07-18","canal":"Proconsumidor","uf":"RJ","origem":"Banco Riacho Azul — Agência Central","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"RE","natureza":"Comercialização","motivo":"Informação divergente na venda"},"conf":74,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: bolsa, celular. Produto sugerido: RE; natureza sugerida: Comercialização. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":20,"texto":"Um pico de energia queimou o freezer da minha mercearia e perdi os congelados. O vistoriador tirou foto do aparelho e dos produtos, mas a resposta que recebi só fala em desgaste do motor. Não entendi se recusaram tudo ou se a mercadoria ainda vai ser analisada. Quero a resposta de cada item, porque o freezer já foi consertado e eu ainda estou esperando pra saber o que fazer com as notas.","data":"2026-07-19","canal":"Canais Internos","uf":"MG","origem":"Corretora Pontal Dourado","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"RE","natureza":"Sinistro","motivo":"Demora na análise do sinistro"},"conf":72,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: vistoria. Produto sugerido: RE; natureza sugerida: Sinistro. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":21,"texto":"Cancelei um seguro pelo aplicativo no dia 28 e tirei print da mensagem ‘solicitação recebida’. No dia 3 veio outra cobrança. A central diz que é do mês passado, só que na fatura aparece com a data deste mês. Quero saber a que período se refere esse valor e em que dia meu seguro deixou de valer.","data":"2026-07-21","canal":"Bacen","uf":"DF","origem":"Corretora Lume Azul","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Baixa","sug":{"produto":"RE","natureza":"Aplicativo","motivo":"Falha em canal digital"},"conf":64,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: aplicativo, mensagem. Produto sugerido: RE; natureza sugerida: Aplicativo. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":22,"texto":"Minha esposa e eu fizemos títulos no mesmo dia, cada um no seu CPF, com os pagamentos saindo da minha conta. O dela chegou ao fim e ela recebeu. O meu sumiu do aplicativo sem cair nada. No telefone, leram um comprovante com o sobrenome dela e disseram que estava pago. Quero que confiram o número do meu título, porque acho que estão usando o pagamento dela pra responder à minha reclamação.","data":"2026-07-21","canal":"Consumidor.gov","uf":"RN","origem":"Banco Aurora do Sul — Agência Jardim","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Baixa","sug":{"produto":"Capitalização","natureza":"Pagamento","motivo":"Cobrança ou débito divergente"},"conf":82,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: título, pagamento. Produto sugerido: Capitalização; natureza sugerida: Pagamento. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":23,"texto":"Recebi um SMS perguntando se eu reconhecia a contratação de um seguro. Respondi ‘NÃO’ e guardei a mensagem. Mesmo assim, já descontaram duas parcelas. Quando liguei, disseram que minha resposta ficou registrada como ‘retorno do cliente’, sem pedido de cancelamento. Pra mim, eu já tinha avisado que não reconhecia. Quero saber quem fez essa venda e por que continuaram cobrando depois da minha resposta.","data":"2026-07-21","canal":"Proconsumidor","uf":"SP","origem":"Banco Cedro Novo — Agência Estação","tipo_origem":"Agência","municipio":"Não informado","dificuldade":"Baixa","sug":{"produto ice."},{"id":26,"texto":"Na proposta do seguro da minha oficina mecânica, declarei que ficam carros de clientes no pátio. Na chuva de granizo, dois deles amassaram. A resposta que recebi fala que ‘o veículo não pertence ao segurado’, mas foi justamente por receber carros dos outros que pedi essa proteção ao corretor. Quero saber se analisaram a apólice da empresa ou se trataram o caso como seguro de um carro particular.","data":"2026-07-24","canal":"Consumidor.gov","uf":"PI","origem":"Corretora Lume Azul","tipo_origem":"Corretora","municipio":"Não informado","dificuldade":"Alta","sug":{"produto":"Auto","natureza":"Comercialização","motivo":"Informação divergente na venda"},"conf":79,"amb":true,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: carro, veículo, oficina, proposta. Produto sugerido: Auto; natureza sugerida: Comercialização. Há sinais concorrentes entre categorias; recomenda-se validação humana."},{"id":27,"texto":"Recebi uma ligação oferecendo aumentar o valor do seguro de vida. Falei que podiam mandar a proposta pra eu ver com calma. Agora tenho dois descontos no mesmo dia e chegaram dois certificados, cada um com um número. Eu achei que iam alterar o seguro que já existia, se eu concordasse. Quero a gravação pra saber em que momento entenderam que autorizei outro contrato.","data":"2026-07-24","canal":"Proconsumidor","uf":"SE","origem":"Central telefônica da Seguradora Brisa Nova","tipo_origem":"Telefônica","municipio":"Não informado","dificuldade":"Média","sug":{"produto":"Vida","natureza":"Comercialização","motivo":"Contratação não reconhecida"},"conf":86,"amb":false,"just":"Classificação simulada por regras de palavras-chave. Termos encontrados: seguro de vida, vida, autoriz, desconto. Produto sugerido: Vida; natureza sugerida: Comercialização."},{"id":28,"texto":"O aplicativo travou quando fui anexar as fotos da batida. Tentei de novo e apareceram dois protocolos. Um está como ‘duplicidade’ e o outro como ‘encerrado’. const aiMsg=j=>`Classificada pelo Gemini: ${j.produto} · ${j.natureza} · ${j.motivo} (${j.conf}% de confiança)${j.removidos?` · ${j.removidos} dado(s) pessoal(is) removido(s) antes do envio`:''}`;
async function aiOne(id,quiet){const rec=SRC().find(y=>y.id===id);ui.busy.add(id);render();try{const j=await askAI(rec.texto),o=st.ov[id]=st.ov[id]||{};o.ai=aiRec(j);delete o.status;delete o.val;logA(id,aiMsg(j));save();if(!quiet)toast(`Gemini: ${j.produto} · ${j.natureza} · ${j.conf}%. ${(j.conf<st.cfg.ap||j.amb)?'Aguardando sua revisão.':'Confira e valide.'}`);return j}finally{ui.busy.delete(id);rebuild();render()}}
function exportCsv(){const rows=srch(filt()).slice().sort((a,b)=>a.id-b.id);if(!rows.length)return toast('Nada para exportar neste recorte.');const H=['id','data','produto','natureza','motivo','canal','origem_contratacao','tipo_origem','uf','municipio','status_classificacao','fonte_sugestao','confianca','dificuldade','texto'],q=v=>'"'+String(v).replace(/"/g,'""')+'"',L=[H.join(';'),...rows.map(r=>[r.id,fd(r.data),r.produto,r.natureza,r.motivo,r.canal,r.origem,r.tipo_origem,r.uf,r.municipio,r.status,r.src==='gemini'?'Gemini':'Regras',r.conf,r.dificuldade,r.texto].map(q).join(';'))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='manifestacoes.csv';a.click();toast(n0(rows.length)+' manifestações exportadas em CSV.')}
const go=p=>{st.page=p;ui.dr=null;ui.fo=false;document.body.classList.remove('no');$('#ovs').style.display='none';save();render();scrollTo(0,0)};
function setStatus(id,s,msg){logA(id,msg);st.ov[id].status=s;ui.edit=null;save();rebuild();render();toast(msg+' ('+pad(id)+')')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,v=t.dataset.v,x=t.dataset.x;if(['flt','flt2','clr'].includes(a))ui.anim=true;
if(a==='nav')go(v);else if(a==='flt'){if(v==='__')return;if(v==='motivo'){st.q=x;go('manif');return}st.f[v]=st.f[v]===x?'':x;if(v==='uf')st.f.mun='';if(['produto','natureza','canal','origem','uf','status'].includes(v)){}save();render()}
else if(a==='flt2'){const[k1,k2]=v.split('|'),[v1,v2]=x.split('|');const sv=(k,w)=>{if(k==='motivo')st.q=w;else st.f[k]=w};sv(k1,v1);sv(k2,v2);save();render()}
else if(a==='clr'){st.f={...F0};st.q='';save();render()}else if(a==='fo'){ui.fo=!ui.fo;render()}else if(a==='exp')exportCsv();
else if(a==='sort'){ui.sort=[v,ui.sort[0]===v?-ui.sort[1]:1];render()}else if(a==='pp'){ui.pg=Math.max(0,ui.pg+ +v);render()}else if(a==='pop'){ui.pop=!ui.pop;render()}
else if(a==='open'){ui.dr={t:'m',id:+v};render()}else if(a==='cd'){ui.dr=null;render()}else if(a==='hist'){ui.dr={t:'hist'};render()}
else if(a==='tab'){ui.tab=v;ui.edit=null;render()}else if(a==='sel'){ui.sel=+v;ui.edit=null;render()}
else if(a==='val'){const r=ALL.find(y=>y.id===+v),o=st.ov[+v]=st.ov[+v]||{};o.val={produto:r.produto,natureza:r.natureza,motivo:r.motivo};ui.dr=null;setStatus(+v,'Validada','Classificação validada')}
else if(a==='fwd'){setStatus(+v,'Em análise','Encaminhada para análise')}else if(a==='edit'){ui.edit={...ALL.find(y=>y.id===+v)};render()}
else if(a==='goedit'){ui.dr=null;ui.sel=+v;ui.edit={...ALL.find(y=>y.id===+v)};st.page='classif';ui.tab='all';save();render()}
else if(a==='cancel'){ui.edit=null;render()}
else if(a==='save'){const id=ui.sel,o=st.ov[id]=st.ov[id]||{};o.val={produto:$('#e_produto').value,natureza:$('#e_natureza').value,motivo:$('#e_motivo').value};setStatus(id,'Validada','Categorias editadas e validadas')}
else if(a==='proc'){const b=ALL.filter(r=>r.status==='Aguardando revisão').length;st.cfg.ap=st.cfg.th;rebuild();const n=ALL.filter(r=>r.status==='Aguardando revisão').length,h=ALL.filter(r=>r.status==='Validada'||r.status==='Em análise').length;st.log.unshift({id:0,t:new Date().toLocaleString('pt-BR'),a:`Limite de confiança reaplicado (${st.cfg.ap}%): ${n} pendentes, ${h} já tratadas por humanos`});save();render();toast(`Limite de ${st.cfg.ap}% aplicado: ${n} manifestações aguardando revisão (antes: ${b}).`)}
else if(a==='ai'){aiOne(+v).catch(err=>toast(err.message))}
else if(a==='aib'){const list=ALL.filter(r=>r.status==='Aguardando revisão'&&r.src!=='gemini').sort((p,q)=>p.conf-q.conf).slice(0,8);if(!list.length)return toast('Nenhuma pendente classificada só por regras. Use "Reclassificar com Gemini" em um caso específico.');(async()=>{ui.batch={d:0,t:list.length};let ok=0;for(const r of list){ui.batch.d++;try{await aiOne(r.id,true);ok++}catch(err){toast(err.message);break}}ui.batch=null;st.log.unshift({id:0,t:new Date().toLocaleString('pt-BR'),a:`Lote com Gemini: ${ok} de ${list.length} manifestações classificadas`});save();rebuild();render();if(ok)toast(`Gemini classificou ${ok} de ${list.length} pendentes. Elas continuam na fila para revisão humana.`)})()}
else if(a==='new'){ui.dr={t:'new'};render();setTimeout(()=>$('#nt')?.focus(),50)}
else if(a==='newsub'){const raw=($('#nt')?.value||'').trim();ui.nt=raw;if(raw.length<20){toast('Escreva pelo menos 20 caracteres.');return}const canal=$('#ncanal').value,uf=$('#nuf').value;ui.busyNew=true;render();askAI(raw).then(j=>{const id=Math.max(...SRC().map(r=>r.id))+1;st.extra.push({id,texto:redactL(raw),data:HOJE,canal,uf,origem:'Não informada',tipo_origem:'Não informada',municipio:'Não informado',dificuldade:'Não informada',sug:{produto:j.produto,natureza:j.natureza,motivo:j.motivo},conf:j.conf,amb:j.amb,just:j.just,nova:true});st.ov[id]={ai:aiRec(j)};logA(id,'Manifestação criada na demonstração. '+aiMsg(j));ui.nt='';ui.dr=null;st.page='classif';ui.tab='all';ui.sel=id;st.f={...F0};st.q='';save();rebuild();render();toast(`${pad(id)} criada: ${j.produto} · ${j.natureza} (${j.conf}%). Revise e valide.`)}).catch(err=>toast(err.message)).finally(()=>{ui.busyNew=false;if(ui.dr)render()})}
else if(a==='rst'){if(confirm('Restaurar a base inicial? Validações e edições serão perdidas.')){st=init();rebuild();save();render();toast('Base inicial restaurada.')}}
else if(a==='go'){const fl=JSON.parse(v);st.f={...F0,...fl};delete st.f.motivo;st.q='';if(fl.motivo)st.q=fl.motivo;go('manif')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.s){ui.anim=true;st.f[t.dataset.s]=t.value;if(t.dataset.s==='uf')st.f.mun='';save();ui.pg=0;render()}else if(t.dataset.c){const all=['id','data','produto','natureza','motivo','canal','origem','uf','municipio','status'],v=st.vis||all;st.vis=t.checked?all.filter(c=>c===t.dataset.c||v.includes(c)):v.filter(c=>c!==t.dataset.c);save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='nt'){ui.nt=e.target.value;const c=$('#ntc');if(c)c.textContent=ui.nt.length+' de 1500 caracteres (mínimo 20)'}else if(e.target.id==='q'){st.q=e.target.value;ui.pg=0;save();render()}else if(e.target.id==='th'){st.cfg.th=+e.target.value;$('#thv').textContent=st.cfg.th+'%';save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.dr){ui.dr=null;render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.cl,path[data-a]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('mousemove',e=>{const t=e.target.closest?.('[data-tip]'),p=$('#tip');if(t){p.style.display='block';p.textContent=t.dataset.tip;p.style.left=Math.min(e.clientX+12,innerWidth-220)+'px';p.style.top=e.clientY+14+'px'}else p.style.display='none'});
$('#mn').onclick=()=>{document.body.classList.add('no');$('#ovs').style.display='block'};$('#ovs').onclick=()=>{document.body.classList.remove('no');$('#ovs').style.display='none'};
render();
</script></body></html>
